plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zalexdev.stryker'
    compileSdk 37
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId "com.zalexdev.stryker"
        minSdk 24
        targetSdk 37
        versionCode 650
        versionName "6.5.0"

        // Identity of the Debian tree this build expects, and the only thing
        // that decides whether an installed chroot is still the right one --
        // there is no chroot OTA path, only this marker. It has to change when
        // a new chroot is published and not otherwise, so it deliberately does
        // NOT track versionCode: bumping the app alone would make every user
        // re-download ~300 MB of tree they already have.
        //
        // It must equal the "version" field of the core block in
        // stryker_manifest.json. The Chroot workflow fails if the two drift,
        // because publishing a chroot the app does not know about leaves every
        // existing install silently running the old one.
        buildConfigField "String", "CHROOT_ID", '"chroot-debian-trixie-uml"'

        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty('STRYKER_RELEASE_STORE_FILE') ?: System.getenv('STRYKER_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword project.findProperty('STRYKER_RELEASE_STORE_PASSWORD') ?: System.getenv('STRYKER_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('STRYKER_RELEASE_KEY_ALIAS') ?: System.getenv('STRYKER_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('STRYKER_RELEASE_KEY_PASSWORD') ?: System.getenv('STRYKER_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.findProperty('STRYKER_RELEASE_STORE_FILE') || System.getenv('STRYKER_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")

        jniLibs.useLegacyPackaging = true

        jniLibs.keepDebugSymbols += [
                "**/libqemu.so",
                "**/libslirp.so",
                "**/libuml.so",
                "**/libstub.so",
                "**/libumnet.so",
                "**/libpasst.so",
                "**/libumusb.so",
                "**/libbash.so",
        ]
    }

    aaptOptions {
        noCompress "tar.gz", "gz", "imgz", "db", "sqlite", "img", "so", "qemu-system-aarch64", "Image"
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.work:work-runtime:2.12.0'

    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.seancfoley:ipaddress:5.6.2'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.facebook.shimmer:shimmer:0.5.0@aar'
    implementation 'jcifs:jcifs:1.3.17'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'
    implementation 'com.nambimobile.widgets:expandable-fab:1.2.1'
    implementation 'com.github.mwiede:jsch:2.28.7'

    implementation project(':terminal')
    implementation project(':NeoTermBridge')
}
