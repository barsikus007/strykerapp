name: Release

# Pushing a tag publishes the APK to a GitHub Release. After a chroot manifest
# merge, the successful Android CI build also replaces the APK in that release
# so its embedded offline chroot URL matches the new manifest. The tag names
# the release and asset: 6.5 -> Stryker.6.5.apk.
on:
  push:
    tags: [ 'v*', '*.*' ]
  workflow_run:
    workflows: [ Android CI ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the release from'
        required: false
        type: string
      apk_run_id:
        description: 'Android CI run ID to publish its existing APK (instead of rebuilding a tag)'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish the APK
    if: github.event_name != 'workflow_run' && (github.event_name != 'workflow_dispatch' || inputs.apk_run_id == '')
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      asset: ${{ steps.meta.outputs.asset }}
      version-code: ${{ steps.meta.outputs.version_code }}
      version-name: ${{ steps.meta.outputs.version_name }}
      signed: ${{ steps.verify.outputs.signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the tag
        id: pick
        run: |
          set -euo pipefail
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null \
            || { echo "::error::no such tag: $tag"; exit 1; }
          short=${tag#v}
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "asset=Stryker.$short.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the SDK the project asks for
        run: |
          set -euo pipefail
          # Read them from the build file rather than repeating the numbers here,
          # so bumping compileSdk or ndkVersion does not leave this behind.
          compile_sdk=$(sed -n 's/.*compileSdk[[:space:]]\{1,\}\([0-9]\{1,\}\).*/\1/p' app/build.gradle | head -1)
          ndk=$(sed -n "s/.*ndkVersion[[:space:]]\{1,\}['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -1)
          echo "compileSdk=$compile_sdk ndk=$ndk"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-$compile_sdk" "ndk;$ndk" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build the release APK
        # The secrets are optional on purpose: a fork or a contributor gets an
        # unsigned APK rather than a failed job. The verify step below says so
        # loudly, because an unsigned release cannot be installed over 6.5.
        env:
          STRYKER_RELEASE_STORE_FILE: ${{ secrets.STRYKER_RELEASE_STORE_FILE }}
          STRYKER_RELEASE_STORE_PASSWORD: ${{ secrets.STRYKER_RELEASE_STORE_PASSWORD }}
          STRYKER_RELEASE_KEY_ALIAS: ${{ secrets.STRYKER_RELEASE_KEY_ALIAS }}
          STRYKER_RELEASE_KEY_PASSWORD: ${{ secrets.STRYKER_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect the APK
        id: meta
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          [ -n "$apk" ] || { echo '::error::assembleRelease produced no APK'; exit 1; }

          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          aapt2=$(find "$sdk" -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$aapt2" ] || { echo "::error::no aapt2 under $sdk"; exit 1; }

          badging=$("$aapt2" dump badging "$apk")
          # `grep -o` returning nothing has to reach the check below, not abort
          # the step, so the || true is load-bearing.
          version_code=$(printf '%s' "$badging" | grep -o "versionCode='[0-9]*'" | head -1 | tr -cd '0-9' || true)
          version_name=$(printf '%s' "$badging" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2 || true)
          [ -n "$version_code" ] && [ -n "$version_name" ] \
            || { echo '::error::could not read the version out of the APK'; exit 1; }

          # The tag is what the release and the asset are called, so a mismatch
          # here means an APK published under someone else's version number.
          short='${{ steps.pick.outputs.tag }}'; short=${short#v}
          apk_short=$(printf '%s' "$version_name" | cut -d. -f1,2)
          [ "$short" = "$apk_short" ] || echo "::warning::tag ${{ steps.pick.outputs.tag }} but versionName is $version_name -- check this release is not misfiled"

          mkdir -p dist
          asset='${{ steps.pick.outputs.asset }}'
          # Unsigned builds must not replace the signed APK used by OTA.
          case "$apk" in
            *-unsigned.apk) asset="${asset%.apk}-unsigned.apk" ;;
          esac
          cp -f "$apk" "dist/$asset"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp -f app/build/outputs/mapping/release/mapping.txt \
                 "dist/${asset%.apk}-mapping.txt"
          fi

          {
            echo "asset=$asset"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "tag:          ${{ steps.pick.outputs.tag }}"
            echo "asset:        $asset"
            echo "versionCode:  $version_code"
            echo "versionName:  $version_name"
            echo "size:         $(stat -c%s "dist/$asset")"
            echo "sha256:       $(sha256sum "dist/$asset" | cut -d' ' -f1)"
            echo "abis:         $(printf '%s' "$badging" | grep -o "native-code: .*" || echo none)"
          } | tee dist/BUILDINFO.txt

      - name: Check what signed it
        id: verify
        run: |
          set -euo pipefail
          asset="dist/${{ steps.meta.outputs.asset }}"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          apksigner=$(find "$sdk" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo '::warning::apksigner not found; cannot confirm the signature'
            exit 0
          fi
          if "$apksigner" verify --print-certs "$asset"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unsigned APK built without release signing credentials."
            echo "::notice::The artifact will be published; the OTA manifest will not be updated."
          fi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.pick.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish to the GitHub Release
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.apk.outputs.tag }}
          path: dist

      - name: Select release assets
        id: assets
        env:
          ASSET: ${{ needs.apk.outputs.asset }}
        run: |
          set -euo pipefail
          test -s "dist/$ASSET"
          # Mapping files exist only when R8 ran; the APK is always required.
          shopt -s nullglob
          {
            echo 'files<<EOF'
            printf '%s\n' "dist/$ASSET" dist/*-mapping.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.apk.outputs.tag }}
          name: Stryker ${{ needs.apk.outputs.tag }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}

  manifest:
    name: Propose the manifest update
    needs: [apk, release]
    if: needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.apk.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.apk.outputs.tag }}
          path: dist

      - name: Point the app block at what was just published
        run: |
          set -euo pipefail
          python3 images/lib/update-manifest.py stryker_manifest.json \
            --app "dist/${{ needs.apk.outputs.asset }}" \
            --app-version-code "${{ needs.apk.outputs.version-code }}" \
            --app-version-name "${{ needs.apk.outputs.version-name }}" \
            --app-url "https://github.com/${{ github.repository }}/releases/download/$TAG/${{ needs.apk.outputs.asset }}"

      - name: Open the pull request
        run: |
          .github/scripts/manifest-pr.sh \
            "manifest/stryker-$TAG" \
            "Manifest: Stryker $TAG (${{ needs.apk.outputs.version-name }}, versionCode ${{ needs.apk.outputs.version-code }})" \
            dist/BUILDINFO.txt

  manifest-apk:
    name: Publish the APK built with the merged chroot manifest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.apk_run_id != '')
    runs-on: ubuntu-latest
    steps:
      - name: Identify the successful Android CI build
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number('${{ inputs.apk_run_id || github.event.workflow_run.id }}')
            });
            if (run.name !== 'Android CI' || run.event !== 'push' ||
                run.head_branch !== 'main' || run.conclusion !== 'success') {
              core.setFailed('The selected run is not a successful Android CI build on main');
              return;
            }
            core.setOutput('sha', run.head_sha);

      - name: Checkout the APK source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Check whether the chroot URL changed
        id: meta
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            old_url=$(git show HEAD^:stryker_manifest.json | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["core"]["debian_v2"]["chroot64"]["url"])')
            new_url=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["core"]["debian_v2"]["chroot64"]["url"])' \
              stryker_manifest.json)
            if [ "$old_url" = "$new_url" ]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          version=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -1)
          [ -n "$version" ] || { echo '::error::versionName not found'; exit 1; }
          tag=${version%.*}
          git rev-parse --verify "refs/tags/$tag" >/dev/null || {
            echo "::error::release tag $tag does not exist"
            exit 1
          }
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the APK from Android CI
        if: steps.meta.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-release
          run-id: ${{ inputs.apk_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Name the release asset
        if: steps.meta.outputs.publish == 'true'
        id: asset
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/*.apk)
          [ "${#apks[@]}" -eq 1 ] || {
            echo '::error::expected exactly one release APK in the Android CI artifact'
            exit 1
          }
          case "${apks[0]}" in
            *-unsigned.apk) asset="Stryker.$TAG-unsigned.apk" ;;
            *)             asset="Stryker.$TAG.apk" ;;
          esac
          mv "${apks[0]}" "dist/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Move the release tag to the APK source
        if: steps.meta.outputs.publish == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            [ "$current_main" = "$(git rev-parse HEAD)" ] || {
              echo '::error::main moved since the APK was built; refusing to publish an older APK'
              exit 1
            }
          else
            git fetch --quiet origin main
            source_url=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["core"]["debian_v2"]["chroot64"]["url"])' \
              stryker_manifest.json)
            main_url=$(git show FETCH_HEAD:stryker_manifest.json | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["core"]["debian_v2"]["chroot64"]["url"])')
            [ "$source_url" = "$main_url" ] || {
              echo '::error::the selected APK has an older chroot URL than main'
              exit 1
            }
          fi
          old=$(git rev-parse "refs/tags/$TAG")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c tag.gpgSign=false tag -fa "$TAG" -m "Stryker $TAG"
          git push --force-with-lease="refs/tags/$TAG:$old" origin "refs/tags/$TAG"

      - name: Publish the APK to the existing release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Stryker ${{ steps.meta.outputs.tag }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/${{ steps.asset.outputs.asset }}
