name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the SDK the project asks for
        run: |
          # Read from the build file rather than repeating the numbers here, so
          # bumping compileSdk or ndkVersion does not leave this behind. This
          # used to install android-33 while app/build.gradle asked for 37, and
          # left AGP to discover that on its own.
          compile_sdk=$(sed -n 's/.*compileSdk[[:space:]]\{1,\}\([0-9]\{1,\}\).*/\1/p' app/build.gradle | head -1)
          ndk=$(sed -n "s/.*ndkVersion[[:space:]]\{1,\}['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -1)
          echo "compileSdk=$compile_sdk ndk=$ndk"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-$compile_sdk" "ndk;$ndk" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          STRYKER_RELEASE_STORE_FILE: ${{ secrets.STRYKER_RELEASE_STORE_FILE }}
          STRYKER_RELEASE_STORE_PASSWORD: ${{ secrets.STRYKER_RELEASE_STORE_PASSWORD }}
          STRYKER_RELEASE_KEY_ALIAS: ${{ secrets.STRYKER_RELEASE_KEY_ALIAS }}
          STRYKER_RELEASE_KEY_PASSWORD: ${{ secrets.STRYKER_RELEASE_KEY_PASSWORD }}
        run: ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
